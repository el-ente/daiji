name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew --no-daemon assembleRelease -PversionName="${GITHUB_REF_NAME#v}"
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daiji-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Pushing a tag like v0.2.0 publishes a release; Daiji's update check reads the latest one.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "daiji-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "daiji-$GITHUB_REF_NAME.apk" --title "Daiji $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
