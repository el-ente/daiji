name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    timeout-minutes: 30
    # Releases from main run one at a time, so two quick merges never pick the same version.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'release' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A merge to main bumps the latest v* tag: patch by default, minor or major when the PR has that label.
      # A pushed v* tag releases as itself. Anything else builds without releasing.
      - name: Pick the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
            if [[ -z "$latest" ]]; then
              tag=v0.1.0
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' || true)
              if grep -qx major <<< "$labels"; then
                tag="v$((major + 1)).0.0"
              elif grep -qx minor <<< "$labels"; then
                tag="v$major.$((minor + 1)).0"
              else
                tag="v$major.$minor.$((patch + 1))"
              fi
            fi
          else
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Release tags must look like v1.2.3, each number 0-99: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release APK
        run: |
          if [[ -n "$TAG" ]]; then
            ./gradlew --no-daemon assembleRelease -PversionName="${TAG#v}"
          else
            ./gradlew --no-daemon assembleRelease
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daiji-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Daiji's update check reads the latest release. Creating the release also creates its tag on this commit.
      - name: Publish release
        if: steps.version.outputs.tag != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk "daiji-$TAG.apk"
          # A re-run on the same tag replaces the APK instead of failing on the existing release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "daiji-$TAG.apk" --clobber
          else
            gh release create "$TAG" "daiji-$TAG.apk" --target "$GITHUB_SHA" --title "Daiji $TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
